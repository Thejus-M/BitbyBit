<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bit by Bit — Tech Explained Visually</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Share+Tech+Mono&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* --- DESIGN SYSTEM FROM BB.HTML --- */
      
      /* Light Theme (Paper-Like) */
      --accent: #2A5D9C;
      --accent-hover: #1e4575;
      --accent-soft: rgba(42, 93, 156, 0.12);
      --accent-bright: #2A5D9C;
      --accent-glow: rgba(42, 93, 156, 0.3);

      --bg-body: #E2DFD6; /* Warm "Old Paper" */
      --bg-card: #EBE8DF; /* Lighter than body */
      --bg-card-elevated: #EBE8DF;
      --text-main: #262626; /* Charcoal */
      --text-sub: #545454;
      --text-code: #262626;
      
      --border: #CFCBC2;
      --border-sub: #D9D6CD;
      --grid-line: #D9D6CD;

      /* --- FONTS --- */
      --font-serif: 'EB Garamond', Georgia, serif;
      --font-main: 'Inter', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --font-mono-sys: 'Share Tech Mono', monospace;
      --font-mono-code: 'JetBrains Mono', monospace;
      --font-pixel: 'Press Start 2P', cursive;
    }


    [data-theme="dark"] {
      --accent: #5682B1;
      --accent-hover: #739EC9;
      --accent-soft: rgba(86, 130, 177, 0.2);
      --accent-bright: #739EC9;
      --accent-glow: rgba(86, 130, 177, 0.3);

      --bg-body: #000000; /* Pure Black */
      --bg-card: #0f0f0f;
      --bg-card-elevated: #0f0f0f;
      
      /* Matching Blue Text from Image */
      --text-main: #6BA4D9; /* Terminal Blue */
      --text-sub: #7398BC; /* Lightened from #4A7091 for WCAG AA contrast on --bg-card */
      --text-code: #6BA4D9;
      
      --border: #4A7091;
      --border-sub: #333333;
      --grid-line: #111111;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: var(--font-main);
      line-height: 1.6;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Visible keyboard focus state for every interactive element */
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    /* Skip link: hidden until keyboard-focused */
    .skip-link {
      position: absolute;
      top: -60px;
      left: 12px;
      z-index: 1000;
      background: var(--accent);
      color: var(--bg-card);
      font-family: var(--font-mono-sys);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 10px 16px;
      text-decoration: none;
      transition: top 0.2s ease;
    }

    .skip-link:focus-visible {
      top: 12px;
      outline: 2px solid var(--bg-card);
      outline-offset: 2px;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      opacity: 0.5;
      pointer-events: none;
    }

    /* HEADER */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 40px;
      background: var(--bg-card);
      z-index: 500;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 20px rgba(0, 212, 255, 0.05);
    }

    .header-brand {
      text-decoration: none;
      display: flex;
      align-items: center;
      min-height: 44px;
    }

    .brand-logo-text {
      font-family: var(--font-pixel);
      font-size: 18px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: -1px;
      position: relative;
      transition: all 0.3s ease;
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-logo-text:hover {
      transform: scale(1.05);
    }

    [data-theme="dark"] .brand-logo-text {
      color: var(--accent-bright);
    }

    .brand-connector {
      color: var(--text-sub);
      font-size: 10px;
      font-family: var(--font-mono-sys);
      text-transform: lowercase;
      font-weight: 300;
      letter-spacing: 0;
    }

    .header-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .header-tagline {
      font-family: var(--font-mono-sys);
      font-size: 9px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: right;
      line-height: 1.4;
    }

    #themeToggle {
      background: none;
      border: 1px solid var(--border);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    #themeToggle:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    #themeToggle:active {
      transform: scale(0.96);
    }

    #themeToggle svg {
      width: 16px;
      height: 16px;
      fill: var(--text-sub);
    }

    /* PAGE LAYOUT */
    .page-wrapper {
      padding-top: 60px;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* HOME HERO SECTION */
    .hero-section {
      padding: 120px 20px 100px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(77, 159, 255, 0.03) 0%, transparent 100%),
        linear-gradient(rgba(235, 232, 223, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(235, 232, 223, 0.03) 1px, transparent 1px);
      background-size: auto, 30px 30px, 30px 30px;
    }

    .hero-container {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-meta-top {
      font-family: var(--font-mono-sys);
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 24px;
      display: inline-block;
      border: 1px solid var(--accent-soft);
      padding: 6px 12px;
      background: var(--bg-card-elevated);
      border-radius: 0;
    }

    /* Visually-hidden but screen-reader accessible text */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .hero-subtitle {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--text-sub);
      line-height: 1.6;
      max-width: 700px;
      margin: 0 auto;
    }

    /* CONTENT LAYOUT Grid */
    .content-layout {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 40px;
    }

    /* SECTION HEADER (above the article grid) */
    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 40px;
    }

    .section-label {
      font-family: var(--font-mono-sys);
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    /* CARD GRID */
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
    }

    .rec-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 40px; 
      transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      text-decoration: none;
      display: flex; 
      flex-direction: column;
      height: 100%;
      /* Resting state: Subtle hard shadow */
      box-shadow: 4px 4px 0 var(--border-sub);
    }

    .rec-card:hover {
      border-color: var(--accent);
      /* Hover state: Lift up and sharpen shadow to accent */
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--accent);
    }

    .rec-card:active {
      /* Press feedback: settle back down toward the resting shadow */
      transform: translate(0, 0);
      box-shadow: 2px 2px 0 var(--accent);
    }

    /* Badge Style */
    .rec-badge {
      align-self: flex-start;
      background: var(--border-sub); /* Neutral background */
      color: var(--text-main);
      font-family: var(--font-mono-sys);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 8px 12px;
      margin-bottom: 24px;
      border-left: 2px solid var(--accent);
    }

    /* Serif Title */
    .rec-card h3 {
      font-family: var(--font-serif);
      font-size: 2rem;
      color: var(--text-main);
      margin-bottom: 16px;
      line-height: 1.2;
    }

    /* Serif Excerpt */
    .rec-excerpt {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 32px;
      flex-grow: 1; /* Pushes footer elements down */
    }

    .rec-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .rec-meta {
      display: flex;
      gap: 24px;
      font-family: var(--font-mono-sys);
      font-size: 10px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .rec-meta span {
      display: flex; align-items: center; gap: 8px;
    }
    
    .rec-meta svg { width: 14px; height: 14px; stroke: currentColor; }

    /* "Read" Button */
    .rec-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border: 1px solid var(--border);
      color: var(--text-main); /* Neutral text initially */
      font-family: var(--font-mono-sys);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      width: fit-content;
      transition: all 0.2s;
    }
    
    /* Hover for Button */
    .rec-btn:hover {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--bg-card); /* Off-white text on blue bg */
      cursor: pointer;
    }

    /* FOOTER */
    .simple-footer {
      border-top: 1px solid var(--border);
      padding: 80px 40px;
      margin-top: 100px;
      background: var(--bg-card);
      position: relative;
    }

    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .footer-home-mark {
      font-family: var(--font-pixel);
      font-size: 16px;
      color: var(--accent);
      text-decoration: none;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .footer-home-mark:hover {
      transform: scale(1.1) translateY(-3px);
      text-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
    }

    .footer-home-mark::after {
      content: ".";
      color: var(--accent);
    }
    
    .footer-info {
      font-family: var(--font-mono-sys);
      font-size: 10px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .header { padding: 0 20px; }
      .hero-section { padding: 80px 20px 60px; }
      .content-layout { padding: 40px 20px; }
      .articles-grid { grid-template-columns: 1fr; }
    }

    /* THE CONSTRUCTED LOGO */
    .logo-construction {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      margin: 40px 0 60px;
      position: relative;
    }

    /* Connective "by" */
    .logo-word-by {
      font-family: var(--font-mono-sys);
      font-size: 1.5rem;
      color: var(--text-sub);
      margin-top: 20px;
      opacity: 0;
      animation: fade-in 1s ease forwards;
      animation-delay: 2.2s;
    }

    /* Letter Container */
    .c-letter {
      width: 60px;
      height: 90px;
      position: relative;
    }

    /* SHARED BLOCK STYLES */
    .c-block {
      background: var(--accent);
      position: absolute;
      /* The "Falling" Animation setup */
      animation: fall-in 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
      box-shadow: inset 2px 2px 0 rgba(235, 232, 223, 0.1);
    }
    
    [data-theme="dark"] .c-block {
       background: #6BA4D9; /* Specifically matching the blue from image */
    }

    /* --- SHAPE DEFINITIONS (14px Grid for thinner look) --- */
    
    /* B SHAPE - Pixel style with rounded corners (shortened bars) */
    .b-stem { width: 14px; height: 100%; left: 0; top: 0; }
    /* Horizontal bars stop short of full width for rounded look */
    .b-top { width: 38px; height: 14px; left: 14px; top: 0; }
    .b-mid { width: 38px; height: 14px; left: 14px; top: 38px; }
    .b-bot { width: 38px; height: 14px; left: 14px; bottom: 0; }
    /* Right segments tucked between bars */
    .b-r-top { width: 14px; height: 24px; right: 0; top: 14px; }
    .b-r-bot { width: 14px; height: 24px; right: 0; bottom: 14px; }

    /* I SHAPE */
    .i-top { width: 100%; height: 14px; top: 0; left: 0; }
    .i-bot { width: 100%; height: 14px; bottom: 0; left: 0; }
    .i-stem { width: 14px; height: 62px; left: 23px; top: 14px; }

    /* T SHAPE */
    .t-top { width: 100%; height: 14px; top: 0; left: 0; }
    .t-stem { width: 14px; height: 76px; left: 23px; top: 14px; }

    /* RANDOM DELAY UTILITIES (0.1s to 2.5s) */
    .d-1 { animation-delay: 0.1s; }
    .d-2 { animation-delay: 0.2s; }
    .d-3 { animation-delay: 0.3s; }
    .d-4 { animation-delay: 0.4s; }
    .d-5 { animation-delay: 0.5s; }
    .d-6 { animation-delay: 0.6s; }
    .d-7 { animation-delay: 0.7s; }
    .d-8 { animation-delay: 0.8s; }
    .d-9 { animation-delay: 0.9s; }
    .d-10 { animation-delay: 1.0s; }
    .d-11 { animation-delay: 1.1s; }
    .d-12 { animation-delay: 1.2s; }
    .d-13 { animation-delay: 1.3s; }
    .d-14 { animation-delay: 1.4s; }
    .d-15 { animation-delay: 1.5s; }
    .d-16 { animation-delay: 1.6s; }
    .d-17 { animation-delay: 1.7s; }
    .d-18 { animation-delay: 1.8s; }
    .d-19 { animation-delay: 1.9s; }
    .d-20 { animation-delay: 2.0s; }
    .d-21 { animation-delay: 2.1s; }
    .d-22 { animation-delay: 2.2s; }
    .d-23 { animation-delay: 2.3s; }
    .d-24 { animation-delay: 2.4s; }
    .d-25 { animation-delay: 2.5s; }

    @keyframes fall-in {
      0% { transform: translateY(-400px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    
    @keyframes fade-in { to { opacity: 1; } }

    @media (max-width: 768px) {
      .logo-construction { transform: scale(0.6); gap: 15px; margin: 20px 0; }
    }
    @media (max-width: 480px) {
      .logo-construction { transform: scale(0.4); gap: 10px; margin: 0; }
      .hero-section { padding-top: 40px; }
      .hero-subtitle { font-size: 1.1rem; }
      .header-tagline { display: none; }
    }

    /* "Till 460px it is perfect" -> Adjust below 460px */
    @media (max-width: 460px) {
      .hero-section {
        padding-left: 12px;
        padding-right: 12px;
      }
      .logo-construction {
        /* Decrease inner padding (gap) and scale slightly */
        gap: 6px;
        transform: scale(0.35); 
      }
    }

    @media (max-width: 360px) {
      .hero-section {
        padding-left: 4px;
        padding-right: 4px;
      }
      .logo-construction {
        /* Tightest fit for very small screens */
        gap: 4px;
        transform: scale(0.3);
      }
    }

    /* Small Screen Optimization (< 355px) */
    @media (max-width: 355px) {
      .content-layout {
        padding: 40px 10px; /* Reduce horizontal padding */
      }
      .rec-card {
        padding: 20px; /* Reduce internal card padding */
      }
    }
  </style>
  <script src="assets/js/theme-init.js"></script>
  <script src="assets/js/theme-image.js"></script>
  <script src="assets/js/blog-data.js"></script>
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Header -->
  <header class="header">
    <a href="index.html" class="header-brand" aria-label="Bit by Bit home">
      <span class="brand-logo-text">BIT<span class="brand-connector">by</span>BIT</span>
    </a>
    <div class="header-status">
      <span class="header-tagline">
        Breaking down tech <br> one bit at a time
      </span>
      <button id="themeToggle" type="button" aria-label="Switch to light theme" aria-pressed="true">
        <svg id="iconSun" viewBox="0 0 24 24" style="display: block;" aria-hidden="true" focusable="false">
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z" />
        </svg>
        <svg id="iconMoon" viewBox="0 0 24 24" style="fill: none; stroke: var(--text-sub); stroke-width: 2; display: none;" aria-hidden="true" focusable="false">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </div>
  </header>

  <main class="page-wrapper" id="main-content">

    <!-- HERO SECTION -->
    <section class="hero-section">
      <div class="hero-container">

        <h1 class="visually-hidden">Bit by Bit — Tech Explained Visually</h1>

        <div class="hero-meta-top">// WELCOME</div>

        <!-- FALLING BLOCK LOGO (decorative; real title is the hidden h1 above) -->
        <div class="logo-construction" aria-hidden="true">

          <!-- B -->
          <div class="c-letter">
            <!-- Letters are built in random order now -->
            <div class="c-block b-stem d-15"></div>
            <div class="c-block b-top d-3"></div>
            <div class="c-block b-mid d-21"></div>
            <div class="c-block b-bot d-8"></div>
            <div class="c-block b-r-top d-12"></div>
            <div class="c-block b-r-bot d-1"></div>
          </div>
          
          <!-- I -->
          <div class="c-letter">
             <div class="c-block i-top d-18"></div>
             <div class="c-block i-stem d-5"></div>
             <div class="c-block i-bot d-23"></div>
          </div>

          <!-- T -->
          <div class="c-letter">
             <div class="c-block t-top d-10"></div>
             <div class="c-block t-stem d-2"></div>
          </div>

          <!-- by -->
          <div class="logo-word-by">by</div>

          <!-- B (Second) -->
          <div class="c-letter">
            <div class="c-block b-stem d-4"></div>
            <div class="c-block b-top d-19"></div>
            <div class="c-block b-mid d-11"></div>
            <div class="c-block b-bot d-24"></div>
            <div class="c-block b-r-top d-7"></div>
            <div class="c-block b-r-bot d-14"></div>
          </div>
          
          <!-- I (Second) -->
          <div class="c-letter">
             <div class="c-block i-top d-22"></div>
             <div class="c-block i-stem d-9"></div>
             <div class="c-block i-bot d-6"></div>
          </div>

          <!-- T (Second) -->
          <div class="c-letter">
             <div class="c-block t-top d-16"></div>
             <div class="c-block t-stem d-20"></div>
          </div>

        </div>

        <p class="hero-subtitle">
          Exploring complex technical concepts through visual storytelling. One bit at a time.
        </p>

      </div>
    </section>

    <!-- CONTENT LAYOUT -->
    <div class="content-layout">
      <div class="section-header">
        <span class="section-label">// ARCHIVE</span>
        <h2 class="section-title">Latest articles</h2>
      </div>
      <!-- Grid container to be populated by JS -->
      <div class="articles-grid" aria-live="polite"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="simple-footer">
    <div class="footer-content">
      <a href="#" class="footer-home-mark" title="Back to top" aria-label="Back to top">T</a>
      <div class="footer-info">
        <span>Bit by Bit Series • 2026</span>
      </div>
    </div>
  </footer>

  <script>
    // Theme Toggle
    const themeBtn = document.getElementById('themeToggle');
    const iconSun = document.getElementById('iconSun');
    const iconMoon = document.getElementById('iconMoon');

    // Function to update icons based on current theme
    function updateThemeIcons() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      if (currentTheme === 'dark') {
          iconSun.style.display = 'block';
          iconMoon.style.display = 'none';
          themeBtn.setAttribute('aria-label', 'Switch to light theme');
          themeBtn.setAttribute('aria-pressed', 'true');
      } else {
          iconSun.style.display = 'none';
          iconMoon.style.display = 'block';
          themeBtn.setAttribute('aria-label', 'Switch to dark theme');
          themeBtn.setAttribute('aria-pressed', 'false');
      }
    }

    // Initialize icons
    updateThemeIcons();

    themeBtn.onclick = () => {
      window.ThemeManager.toggle();
      updateThemeIcons();
    };

    // --- DYNAMIC BLOG RENDERING ---
    (function renderBlogs() {
      const grid = document.querySelector('.articles-grid');
      if (!grid || typeof BLOG_DATA === 'undefined') return;

      grid.innerHTML = ''; // Clear loading state

      BLOG_DATA.forEach(post => {
        const card = document.createElement('a');
        card.className = 'rec-card';

        if (post.isComingSoon) {
          // Coming-soon cards are not a real destination yet: keep them
          // out of tab order and announce disabled state (pointer-events
          // alone does not block keyboard activation).
          card.removeAttribute('href');
          card.style.opacity = '0.6';
          card.style.pointerEvents = 'none';
          card.setAttribute('aria-disabled', 'true');
          card.setAttribute('tabindex', '-1');
        } else {
          card.href = post.link;
        }

        // Badge
        let badgeHTML = '';
        if (post.tags && post.tags.length > 0) {
          badgeHTML = post.tags.map(tag => `<span class="rec-badge">// ${tag}</span>`).join('');
        }

        // Svg Icons
        const dateIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>`;
        const timeIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;
        const arrowIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;

        // Button and Meta content logic
        const btnText = post.isComingSoon ? 'Coming soon' : `Read Article ${arrowIcon}`;
        
        let metaContent = `<span>${dateIcon} ${post.date}</span>`;
        if (!post.isComingSoon) {
          metaContent += `<span>${timeIcon} ${post.readTime}</span>`;
        }

        card.innerHTML = `
          ${badgeHTML}
          <h3>${post.title}</h3>
          <p class="rec-excerpt">${post.excerpt}</p>
          
          <div class="rec-footer">
            <div class="rec-meta">
              ${metaContent}
            </div>
            <div class="rec-btn">
              ${btnText}
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    })();
  </script>
</body>
</html>
